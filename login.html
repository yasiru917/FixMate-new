<!DOCTYPE html>
<html lang="en">

<head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>FixMate — Sign In</title>

        <!-- Google Fonts: Manrope (headline) + Inter (body) -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700&family=Inter:wght@400;600&display=swap"
                rel="stylesheet" />

        <!-- Compiled Tailwind output -->
        <link rel="stylesheet" href="./src/output.css" />

        <style>
                /* ── Divider ─────────────────────────────────────────── */
                .divider {
                        display: flex;
                        align-items: center;
                        gap: 0.75rem;
                        color: var(--color-on-surface-variant);
                        font-size: 0.75rem;
                        margin: 1.5rem 0;
                }

                .divider::before,
                .divider::after {
                        content: "";
                        flex: 1;
                        height: 1px;
                        background: var(--color-outline-variant, rgba(0, 0, 0, 0.12));
                }

                /* ── Google button ───────────────────────────────────── */
                .btn-google {
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        gap: 0.625rem;
                        width: 100%;
                        padding: 0.625rem 1rem;
                        border: 1px solid var(--color-outline-variant, rgba(0, 0, 0, 0.2));
                        border-radius: 0.5rem;
                        background: transparent;
                        font-size: 0.875rem;
                        font-weight: 600;
                        color: var(--color-on-surface);
                        cursor: pointer;
                        transition: background 0.15s ease, box-shadow 0.15s ease;
                }

                .btn-google:hover {
                        background: var(--color-surface-variant, rgba(0, 0, 0, 0.04));
                        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
                }

                .btn-google svg {
                        flex-shrink: 0;
                }

                /* ── Forgot password link ────────────────────────────── */
                .btn-forgot {
                        background: none;
                        border: none;
                        padding: 0;
                        font-size: 0.75rem;
                        font-weight: 600;
                        cursor: pointer;
                        color: var(--color-primary);
                        transition: opacity 0.15s;
                }

                .btn-forgot:hover {
                        opacity: 0.75;
                }
        </style>
</head>

<body class="auth-page-bg">

        <!-- ── Toast ──────────────────────────────────────────────── -->
        <div id="toast" class="toast toast-hidden" role="alert" aria-live="polite">
                <span id="toast-icon"></span>
                <span id="toast-msg"></span>
        </div>

        <!-- ── Back to home ──────────────────────────────────────── -->
        <a href="index.html" style="position:fixed; top:1.25rem; left:1.25rem; z-index:50;
           display:flex; align-items:center; gap:0.375rem;
           font-size:0.8125rem; font-weight:600; text-decoration:none;
           color:var(--color-on-surface-variant, #555);
           background:var(--color-surface-container-lowest, #fff);
           border:1px solid var(--color-outline-variant, rgba(0,0,0,0.12));
           padding:0.375rem 0.875rem 0.375rem 0.625rem;
           border-radius:9999px;
           box-shadow:0 1px 4px rgba(0,0,0,0.08);
           transition:box-shadow 0.15s, color 0.15s;"
                onmouseover="this.style.color='var(--color-primary,#003d9b)'; this.style.boxShadow='0 2px 8px rgba(0,0,0,0.12)';"
                onmouseout="this.style.color='var(--color-on-surface-variant,#555)'; this.style.boxShadow='0 1px 4px rgba(0,0,0,0.08)';"
                aria-label="Return to home page">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <path d="M19 12H5M5 12l7-7M5 12l7 7" />
                </svg>
                Home
        </a>

        <!-- ── Auth card ──────────────────────────────────────────── -->
        <div class="animate-auth-card card w-full max-w-md overflow-hidden !p-0">

                <!-- Accent bar -->
                <div class="card-accent-bar"></div>

                <div class="p-8 sm:p-10">

                        <!-- Brand -->
                        <div class="flex flex-col items-center justify-center gap-3 mb-1">
                                <span class="text-headline-md text-primary-container">FixMate</span>
                                <p class="text-body-sm mb-8" style="color: var(--color-on-surface-variant);">
                                        Sign in to your roadside assistance account.
                                </p>
                        </div>

                        <!-- ── Google OAuth (wired up, just add provider in Supabase dashboard) ── -->
                        <button id="google-signin-btn" class="btn-google" type="button">
                                <!-- Google "G" icon -->
                                <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
                                        <g fill="none" fill-rule="evenodd">
                                                <path d="M17.64 9.205c0-.639-.057-1.252-.164-1.841H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"
                                                        fill="#4285F4" />
                                                <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"
                                                        fill="#34A853" />
                                                <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"
                                                        fill="#FBBC05" />
                                                <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"
                                                        fill="#EA4335" />
                                        </g>
                                </svg>
                                Continue with Google
                        </button>

                        <!-- Divider -->
                        <div class="divider">or sign in with email</div>

                        <!-- ── Form ─────────────────────────────────────────── -->
                        <form id="login-form" novalidate>

                                <!-- Email -->
                                <div class="form-field mb-4">
                                        <label for="email" class="form-label">Email address</label>
                                        <input id="email" type="email" placeholder="you@example.com"
                                                autocomplete="email" class="form-input" />
                                        <p class="form-error" id="email-err"></p>
                                </div>

                                <!-- Password -->
                                <div class="form-field mb-2">
                                        <div class="flex items-center justify-between mb-1">
                                                <label for="password" class="form-label !mb-0">Password</label>
                                                <button type="button" id="forgot-password-btn" class="btn-forgot">
                                                        Forgot password?
                                                </button>
                                        </div>
                                        <div class="relative">
                                                <input id="password" type="password" placeholder="Your password"
                                                        class="form-input form-input-icon-right" />
                                                <button type="button" class="btn-eye" data-target="password"
                                                        aria-label="Toggle password visibility">
                                                        <svg class="w-4 h-4" fill="none" stroke="currentColor"
                                                                stroke-width="2" viewBox="0 0 24 24">
                                                                <path
                                                                        d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                                                <circle cx="12" cy="12" r="3" />
                                                        </svg>
                                                </button>
                                        </div>
                                        <p class="form-error" id="password-err"></p>
                                </div>

                                <!-- Remember me -->
                                <div class="flex items-center gap-2 mb-8 mt-4">
                                        <input id="remember-me" type="checkbox"
                                                class="w-4 h-4 rounded accent-[var(--color-primary)] cursor-pointer" />
                                        <label for="remember-me" class="text-body-sm cursor-pointer select-none"
                                                style="color: var(--color-on-surface-variant);">
                                                Remember me
                                        </label>
                                </div>

                                <!-- Submit -->
                                <button id="submit-btn" type="submit" class="btn btn-primary w-full">
                                        Sign in
                                </button>

                                <!-- Cancel -->
                                <a href="index.html" class="text-body-sm text-center mt-3 w-full hover:underline"
                                        style="display:block; color:var(--color-on-surface-variant); text-decoration:none;">
                                        Cancel — return to home
                                </a>

                                <!-- Footer -->
                                <p class="text-body-sm text-center mt-6"
                                        style="color: var(--color-on-surface-variant);">
                                        Don't have an account?
                                        <a href="signup.html" class="font-semibold hover:underline"
                                                style="color: var(--color-primary);">Create one</a>
                                </p>

                        </form>
                </div>
        </div>

        <!--
    ✅ LOAD ORDER:
    1. Supabase CDN must come first — exposes window.supabase global
    2. login.js comes after — uses that global to createClient()
  -->
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="./src/js/login.js"></script>

</body>

</html>
