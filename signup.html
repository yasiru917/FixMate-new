<!DOCTYPE html>
<html lang="en">

<head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>FixMate — Sign Up</title>

        <!-- Google Fonts: Manrope (headline) + Inter (body) -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700&family=Inter:wght@400;600&display=swap"
                rel="stylesheet" />

        <!-- Compiled Tailwind output -->
        <link rel="stylesheet" href="./src/output.css" />
</head>

<body class="auth-page-bg">

        <!-- ── Toast ──────────────────────────────────────────────── -->
        <div id="toast" class="toast toast-hidden" role="alert" aria-live="polite">
                <span id="toast-icon"></span>
                <span id="toast-msg"></span>
        </div>

        <!-- ── Back to home ──────────────────────────────────────── -->
        <a href="index.html" style="position:fixed; top:1.25rem; left:1.25rem; z-index:50;
           display:flex; align-items:center; gap:0.375rem;
           font-size:0.8125rem; font-weight:600; text-decoration:none;
           color:var(--color-on-surface-variant, #555);
           background:var(--color-surface-container-lowest, #fff);
           border:1px solid var(--color-outline-variant, rgba(0,0,0,0.12));
           padding:0.375rem 0.875rem 0.375rem 0.625rem;
           border-radius:9999px;
           box-shadow:0 1px 4px rgba(0,0,0,0.08);
           transition:box-shadow 0.15s, color 0.15s;"
                onmouseover="this.style.color='var(--color-primary,#003d9b)'; this.style.boxShadow='0 2px 8px rgba(0,0,0,0.12)';"
                onmouseout="this.style.color='var(--color-on-surface-variant,#555)'; this.style.boxShadow='0 1px 4px rgba(0,0,0,0.08)';"
                aria-label="Return to home page">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <path d="M19 12H5M5 12l7-7M5 12l7 7" />
                </svg>
                Home
        </a>

        <!-- ── Auth card ──────────────────────────────────────────── -->
        <div class="animate-auth-card card w-full max-w-2xl overflow-hidden !p-0">

                <!-- Accent bar -->
                <div class="card-accent-bar"></div>

                <div class="p-8 sm:p-10">

                        <!-- Brand -->
                        <div class="flex flex-col items-center justify-center gap-3 mb-1">
                                <span class="text-headline-md text-primary-container">FixMate</span>
                                <p class="text-body-sm mb-8" style="color: var(--color-on-surface-variant);">
                                        Create your emergency roadside assistance account.
                                </p>
                        </div>

                        <!-- ── Form ─────────────────────────────────────────── -->
                        <form id="signup-form" novalidate>

                                <!-- Email -->
                                <div class="form-field mb-4">
                                        <label for="email" class="form-label">Email address</label>
                                        <input id="email" type="email" placeholder="you@example.com"
                                                autocomplete="email" class="form-input" />
                                        <p class="form-error" id="email-err"></p>
                                </div>

                                <!-- Phone + NIC -->
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                                        <div class="form-field">
                                                <label for="phone" class="form-label">Phone number</label>
                                                <input id="phone" type="tel" placeholder="+94 77 000 0000"
                                                        class="form-input" />
                                                <p class="form-error" id="phone-err"></p>
                                        </div>
                                        <div class="form-field">
                                                <label for="nic" class="form-label">NIC number</label>
                                                <input id="nic" type="text" placeholder="National ID"
                                                        class="form-input" />
                                                <p class="form-error" id="nic-err"></p>
                                        </div>
                                </div>

                                <!-- Password + Confirm -->
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-8">
                                        <div class="form-field">
                                                <label for="password" class="form-label">Password</label>
                                                <div class="relative">
                                                        <input id="password" type="password"
                                                                placeholder="Min. 6 characters"
                                                                class="form-input form-input-icon-right" />
                                                        <button type="button" class="btn-eye" data-target="password"
                                                                aria-label="Toggle password visibility">
                                                                <svg class="w-4 h-4" fill="none" stroke="currentColor"
                                                                        stroke-width="2" viewBox="0 0 24 24">
                                                                        <path
                                                                                d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                                                        <circle cx="12" cy="12" r="3" />
                                                                </svg>
                                                        </button>
                                                </div>
                                                <p class="form-error" id="password-err"></p>
                                        </div>
                                        <div class="form-field">
                                                <label for="confirm-password" class="form-label">Confirm
                                                        password</label>
                                                <div class="relative">
                                                        <input id="confirm-password" type="password"
                                                                placeholder="Repeat"
                                                                class="form-input form-input-icon-right" />
                                                        <button type="button" class="btn-eye"
                                                                data-target="confirm-password"
                                                                aria-label="Toggle password visibility">
                                                                <svg class="w-4 h-4" fill="none" stroke="currentColor"
                                                                        stroke-width="2" viewBox="0 0 24 24">
                                                                        <path
                                                                                d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                                                        <circle cx="12" cy="12" r="3" />
                                                                </svg>
                                                        </button>
                                                </div>
                                                <p class="form-error" id="confirm-password-err"></p>
                                        </div>
                                </div>

                                <!-- Submit -->
                                <button id="submit-btn" type="submit" class="btn btn-primary w-full">
                                        Create account
                                </button>

                                <!-- Cancel -->
                                <a href="index.html" class="text-body-sm text-center mt-3 w-full hover:underline"
                                        style="display:block; color:var(--color-on-surface-variant); text-decoration:none;">
                                        Cancel — return to home
                                </a>

                                <!-- Footer -->
                                <p class="text-body-sm text-center mt-6"
                                        style="color: var(--color-on-surface-variant);">
                                        Already have an account?
                                        <a href="login.html" class="font-semibold hover:underline"
                                                style="color: var(--color-primary);">Sign in</a>
                                </p>

                        </form>
                </div>
        </div>

        <!--
    ✅ LOAD ORDER MATTERS:
    1. Supabase CDN must come first — exposes window.supabase global
    2. signup.js comes after — uses that global to createClient()
  -->
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="./src/js/signup.js"></script>

</body>

</html>
